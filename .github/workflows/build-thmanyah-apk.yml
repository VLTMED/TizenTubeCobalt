name: Thmanyah Arabic TV APK

on:
  push:
    branches:
      - feature/thmanyah-arabic-tv-typography
    paths:
      - .github/actions/build/**
      - .github/actions/docker/**
      - .github/config/thmanyah-android-arm64.json
      - .github/workflows/build-thmanyah-apk.yml
      - .github/workflows/main.yaml
      - cobalt/renderer/**
      - cobalt/build/configs/android-arm64/**
      - third_party/thmanyah-fonts/**
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/build/**
      - .github/actions/docker/**
      - .github/config/thmanyah-android-arm64.json
      - .github/workflows/build-thmanyah-apk.yml
      - .github/workflows/main.yaml
      - cobalt/renderer/**
      - cobalt/build/configs/android-arm64/**
      - third_party/thmanyah-fonts/**
  workflow_dispatch:

permissions: read-all

jobs:
  font-generator-tests:
    name: Font generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate CI config
        run: python3 -m json.tool .github/config/thmanyah-android-arm64.json > /dev/null
      - name: Run font generator tests
        run: python3 cobalt/renderer/generate_thmanyah_font_header_unittest.py

  android-arm64-apk:
    name: Build Android arm64 QA APK
    if: github.event_name != 'pull_request'
    needs: font-generator-tests
    uses: ./.github/workflows/main.yaml
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      platform: thmanyah-android-arm64
      nightly: 'false'
      use_github_hosted: true
    secrets:
      datadog_api_key: ${{ secrets.DD_API_KEY }}

  sign-apks:
    name: Sign APKs for repeatable test installs
    needs: android-arm64-apk
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-arm64 APKs
          path: unsigned
      - name: Sign APKs with stable test key
        shell: bash
        env:
          TIZENTUBE_CI_TEST_KEYSTORE_B64: ${{ secrets.TIZENTUBE_CI_TEST_KEYSTORE_B64 }}
          TIZENTUBE_CI_TEST_KEYSTORE_PASSWORD: ${{ secrets.TIZENTUBE_CI_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TIZENTUBE_CI_TEST_KEYSTORE_B64}" || -z "${TIZENTUBE_CI_TEST_KEYSTORE_PASSWORD}" ]]; then
            echo "::error::Missing stable test signing secrets."
            exit 1
          fi

          keystore="${RUNNER_TEMP}/tizentube-tv-test.jks"
          printf '%s' "${TIZENTUBE_CI_TEST_KEYSTORE_B64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"

          sdk_root=""
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /usr/lib/android-sdk; do
            if [[ -n "${candidate}" && -d "${candidate}/build-tools" ]]; then
              sdk_root="${candidate}"
              break
            fi
          done
          if [[ -z "${sdk_root}" ]]; then
            echo "::error::Android SDK build-tools were not found on the signing runner."
            exit 1
          fi

          tool_dir="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apksigner="${tool_dir}/apksigner"
          zipalign="${tool_dir}/zipalign"
          if [[ ! -x "${apksigner}" || ! -x "${zipalign}" ]]; then
            echo "::error::apksigner or zipalign is missing from ${tool_dir}."
            exit 1
          fi

          mkdir -p signed
          cp -a unsigned/. signed/
          mapfile -d '' -t apks < <(find signed -type f -name '*.apk' -print0)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::The Android build artifact contains no APK files."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            aligned="${apk}.aligned"
            "${zipalign}" -p -f 4 "${apk}" "${aligned}"
            mv "${aligned}" "${apk}"
            "${apksigner}" sign \
              --ks "${keystore}" \
              --ks-key-alias tizentube-tv-test \
              --ks-pass env:TIZENTUBE_CI_TEST_KEYSTORE_PASSWORD \
              --key-pass env:TIZENTUBE_CI_TEST_KEYSTORE_PASSWORD \
              "${apk}"
            "${apksigner}" verify --verbose --print-certs "${apk}"
          done
      - name: Upload stable-signature APK artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-arm64 APKs - stable test signature
          path: signed/
          if-no-files-found: error
